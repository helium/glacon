[workspace]
resolver = "3"
members = ["glacon-core", "glacon-helium", "test-proto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
humantime = "2"
humantime-serde = "1"
metrics = "0.24"
metrics-util = { version = "0.20", features = ["debugging"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "migrate",
  "macros",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
triggered = "0.1"

# Oracles
file-store = { git = "https://github.com/helium/oracles", branch = "main", default-features = false }
helium-iceberg = { git = "https://github.com/helium/oracles", branch = "main", default-features = false }
task-manager = { git = "https://github.com/helium/oracles", branch = "main" }

glacon-core = { path = "glacon-core" }
glacon-test-proto = { path = "test-proto" }
