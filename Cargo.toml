[package]
name = "glacon"
version = "0.1.0"
edition = "2024"
description = "Route protobuf files from S3 buckets into Iceberg tables"
license = "Apache-2.0"
publish = false

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
humantime = "2"
humantime-serde = "1"
metrics = "0.24"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "migrate",
  "macros",
] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
triggered = "0.1"
twox-hash = "2"

# Oracles
file-store = { git = "https://github.com/helium/oracles", branch = "main", default-features = false }
helium-iceberg = { git = "https://github.com/helium/oracles", branch = "main", default-features = false }
task-manager = { git = "https://github.com/helium/oracles", branch = "main" }

[dev-dependencies]
anyhow = "1"
chrono = "0.4"
glacon-test-proto = { path = "test-proto" }
helium-iceberg = { git = "https://github.com/helium/oracles", branch = "main", default-features = false, features = [
  "test-harness",
] }
metrics-util = { version = "0.20", features = ["debugging"] }
serde_json = "1"
tempfile = "3"
trino-rust-client = "0.11"
triggered = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
