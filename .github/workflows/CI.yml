name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  compute-base-build-tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.out.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Create Tag
        id: out
        run: echo "tag=${{ hashFiles('Dockerfile','rust-toolchain.toml') }}" >> "$GITHUB_OUTPUT"

  # The base image is CI's toolchain, built once per Dockerfile and
  # rust-toolchain.toml and cached in ghcr.io.
  build-base:
    needs: compute-base-build-tag
    runs-on: ubuntu-latest
    env:
      CACHE_HIT: false
      IMAGE: ghcr.io/${{ github.repository }}/base:${{ needs.compute-base-build-tag.outputs.image_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Cached base Image
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "CACHE_HIT=true" >> $GITHUB_ENV
          else
            echo "CACHE_HIT=false" >> $GITHUB_ENV
          fi
      - name: Set up Docker Buildx
        if: env.CACHE_HIT == 'false'
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Build and Push base Image (if not cached)
        if: env.CACHE_HIT == 'false'
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7
        with:
          context: .
          file: Dockerfile
          target: base
          push: true
          tags: ${{ env.IMAGE }}

  fmt:
    needs: [compute-base-build-tag, build-base]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/base:${{ needs.compute-base-build-tag.outputs.image_tag }}
      options: --user 1001:1001
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-fmt
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    needs: [compute-base-build-tag, build-base]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/base:${{ needs.compute-base-build-tag.outputs.image_tag }}
      options: --user 1001:1001
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-clippy
      cancel-in-progress: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Cache Cargo Target Directory
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: target
          key: clippy-base-${{ needs.compute-base-build-tag.outputs.image_tag }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            clippy-base-${{ needs.compute-base-build-tag.outputs.image_tag }}-
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -Dclippy::all -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  # Every test of the workspace in one job, against the services
  # docker-compose.yml runs locally.
  tests:
    needs: [compute-base-build-tag, build-base]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/base:${{ needs.compute-base-build-tag.outputs.image_tag }}
      options: --user 1001:1001
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-tests
      cancel-in-progress: true
    services:
      rustfs:
        image: rustfs/rustfs:1.0.0-alpha.90
        ports:
          - 9000:9000
          - 4566:9000
        env:
          RUSTFS_CONSOLE_ENABLE: false
          RUSTFS_ACCESS_KEY: admin
          RUSTFS_SECRET_KEY: admin
      polaris:
        image: apache/polaris:1.7.0
        env:
          POLARIS_PERSISTENCE_TYPE: in-memory
          POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
          POLARIS_REALM_CONTEXT_REALMS: POLARIS
          QUARKUS_OTEL_SDK_DISABLED: "true"
          POLARIS_FEATURES__ALLOW_INSECURE_STORAGE_TYPES: "true"
          POLARIS_FEATURES__SUPPORTED_CATALOG_STORAGE_TYPES: '["S3"]'
          POLARIS_READINESS__IGNORE_SEVERE_ISSUES: "true"
          POLARIS_FEATURES__DROP_WITH_PURGE_ENABLED: "true"
          AWS_REGION: us-west-2
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: admin
        ports:
          - 8181:8181
      trino:
        image: trinodb/trino:483
        env:
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: admin
          CATALOG_MANAGEMENT: dynamic
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Cache Cargo Target Directory
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: target
          key: tests-base-${{ needs.compute-base-build-tag.outputs.image_tag }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            tests-base-${{ needs.compute-base-build-tag.outputs.image_tag }}-

      # The bucket every test catalog stores its tables in (the rustfs-init
      # service of docker-compose.yml).
      - name: Rustfs init
        timeout-minutes: 1
        env:
          AWS_ACCESS_KEY_ID: admin
          AWS_SECRET_ACCESS_KEY: admin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          until curl -sf http://rustfs:9000/health > /dev/null 2>&1; do
            echo "...waiting for Rustfs..."
            sleep 2
          done
          aws --endpoint-url http://rustfs:9000 s3 mb s3://iceberg-test 2>/dev/null \
            || echo "bucket iceberg-test already exists"

      - name: Wait for Trino
        timeout-minutes: 1
        run: |
          until curl -sf http://trino:8080/v1/info | grep -q '"starting":false'; do
            echo "...waiting for Trino..."
            sleep 2
          done
          echo "Trino is up"

      - name: Run tests
        env:
          AWSLOCAL_HOST: rustfs
          AWSLOCAL_PORT: 9000
          S3_QUALIFIED_HOST: rustfs
          S3_LOCAL_HOST: rustfs
          CATALOG_QUALIFIED_HOST: polaris
          CATALOG_LOCAL_HOST: polaris
          TRINO_HOST: trino
        run: cargo nextest run --workspace --locked --no-fail-fast
