# Scans the full git history for secrets (API keys, tokens, private keys,
# ...). Only verified ones, confirmed live against their service, are reported.

name: TruffleHog Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Need full history for TruffleHog
          persist-credentials: false

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          path: ./
          extra_args: --debug --results verified
