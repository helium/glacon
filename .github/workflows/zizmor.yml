# Audits the workflows and dependabot.yml for unpinned actions, broad
# permissions, credential leaks, injection, ...

name: zizmor

on:
  pull_request:
    branches: [main]
    paths: [".github/**"]
  push:
    branches: [main]
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          collect: all
          # SARIF upload needs GitHub Advanced Security: report in the log instead.
          advanced-security: false
          annotations: true
